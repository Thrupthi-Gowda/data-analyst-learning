<!DOCTYPE html>
<html>
<head>
    <title>Update Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="update-container">

    <h2>✏️ Update Product</h2>

    <form method="POST">

        <input
            type="text"
            name="product_name"
            value="{{ data[1] }}"
            required>

        <input
            type="text"
            name="warehouse_name"
            value="{{ data[2] }}"
            required>

        <input
            type="number"
            name="quantity"
            value="{{ data[3] }}"
            required>

        <input
            type="number"
            step="0.01"
            name="price"
            value="{{ data[4] }}"
            required>

        <button type="submit">
            Update Product
        </button>

    </form>

</div>

</body>
</html>
